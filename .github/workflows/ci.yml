name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: vet (js/wasm)
        shell: bash
        run: GOOS=js GOARCH=wasm go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: coverage gate (100%)
        shell: bash
        run: |
          go test -count=1 -coverprofile=cov.out ./...
          go tool cover -func=cov.out | tee cov.txt
          grep -q 'total:.*100.0%' cov.txt || { echo "coverage below 100%"; exit 1; }

  linux-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test (32-bit int)
        env:
          GOARCH: "386"
        run: go test -count=1 ./...

  # The byte stream a program writes to a terminal is untrusted input: the
  # parser is fuzzed on every change, over the committed corpus in
  # testdata/fuzz/FuzzWrite.
  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzWrite]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 45s .

  # Every go-widgets module cross-compiles for the six 64-bit Linux
  # architectures, s390x the big-endian one. vet compiles the tests too.
  cross:
    name: cross linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet, tests included
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
